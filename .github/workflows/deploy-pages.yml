name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out published archive
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract and verify static portfolio
        shell: bash
        run: |
          set -euo pipefail
          test -s Ram-Karnati-GitHub-Pages.zip
          unzip -tq Ram-Karnati-GitHub-Pages.zip
          mkdir -p _site
          unzip -q Ram-Karnati-GitHub-Pages.zip -d _site
          for file in index.html favicon.svg Ram-Karnati-Resume.pdf AQUA-Research-Paper.pdf; do
            test -s "_site/$file"
          done
          test -f _site/.nojekyll
          test -d _site/_next/static/chunks
          test -d _site/fonts

      - name: Upload static portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
